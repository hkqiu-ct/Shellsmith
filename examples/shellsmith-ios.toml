# 复制后填写真实工程、签名和业务信息；不要在这里保存私钥或 Apple 账号令牌。
[project]
path = "../YourApp/YourApp.xcworkspace"
scheme = "YourApp"
configuration = "Release"
team_id = "ABCDE12345"
bundle_ids = ["com.example.yourapp"]
# 工程有多个 @main 时填写相对源码根目录的入口。
# entrypoint = "YourApp/YourApp.swift"

[protection]
profile = "balanced"
is_prod = true
# App Attest 服务端地址可选；服务端负责挑战、证明校验和重放防护。
# app_attest_endpoint = "https://api.example.com/app-attest"

# Optional: enable Swift Confidential for project-specific sensitive literals.
# Omit this section when you do not have a confidential.yml file; freeRASP
# and the rest of the iOS protection pipeline will still run.
# [confidential]
# enabled = true
# config = "confidential.yml"

[rasp]
provider = "freerasp"
enabled = true
# watcher_mail is optional; omit it when no Talsec watcher email is desired.
# watcher_mail = "security@example.com"
critical = ["signature", "jailbreak", "debugger", "runtimeManipulation"]
# Opt-in: terminate the process when a listed critical threat is detected.
# Default false because terminating a production app is a product policy.
# block_on_critical = false
