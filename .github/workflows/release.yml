name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 1.2.3"
        required: true
        type: string

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_NDK_API19_VERSION: 25.2.9519653

jobs:
  prepare:
    name: 准备草稿 Release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: 创建草稿
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "缺少更新签名密钥"; exit 1; }
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="$(python3 -c 'import json; print(json.load(open("apps/shield-gui/package.json", encoding="utf-8"))["version"])')"
            version="${version}-build.${{ github.event.workflow_run.run_number }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > release-draft.txt 2>/dev/null; then
            test "$(cat release-draft.txt)" = true || { echo "禁止覆盖已公开的 Release，请提升版本号"; exit 1; }
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --draft \
              --title "$tag" \
              --notes "Build in progress."
          fi

  linux-tauri:
    name: Linux Tauri 发布包
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0



      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shield-gui/package-lock.json

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf \
            libfuse2

      - name: 配置 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "ndk;${ANDROID_NDK_API19_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 准备 Linux AAB 工具并写入 GUI 资源
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fsSL --retry 5 \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            -o tools/bundletool.jar
          aapt2="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt2 -perm -111 | sort -V | tail -n 1)"
          test -n "$aapt2" && test -x "$aapt2"
          cp "$aapt2" tools/aapt2
          chmod +x tools/aapt2
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("apps/shield-gui/src-tauri/tauri.conf.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          resources = config["bundle"]["resources"]
          resources["../../../tools/bundletool.jar"] = "tools/bundletool.jar"
          resources["../../../tools/aapt2"] = "tools/aapt2"
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: 配置 Rust target 与构建工具
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          cargo install cargo-ndk --locked
          cargo install tauri-cli --version 2.11.5 --locked
          cargo install cargo-deb --locked
          rustup toolchain install 1.77.2 --profile minimal --target armv7-linux-androideabi

      - name: 同步发布版本号
        shell: bash
        run: bash scripts/bump-version.sh "$VERSION"

      - name: 从源码重建 PVM2 打包器
        shell: bash
        run: python3 scripts/build_pvm2_packer.py

      # 打包器 JAR 与运行时源码现在都在本仓库内（third_party/xopprotector），
      # 因此这里恢复为硬性闸门：两侧格式版本不一致就直接失败，不再放行。
      - name: 校验 PVM2 打包器与运行时格式版本一致
        shell: bash
        run: |
          python3 scripts/verify_pvm2_packager_version.py \
            --jar tools/xop-pvm2-packer.jar \
            --xop-root third_party/xopprotector

      - name: 安装 GUI 前端依赖
        working-directory: apps/shield-gui
        run: npm ci

      - name: 构建 Linux Tauri 发布包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: SKIP_CLI_RELEASE=1 VERSION="$VERSION" ./scripts/release-linux.sh "$VERSION"

      - name: 验证更新验签与 GUI 回归
        run: cargo test -p mocika-shield

      - name: 打包 Android 加固运行时资源
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import hashlib
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          version = sys.argv[1]
          root = Path.cwd()
          source = root / "shield-stub" / "build" / "outputs" / "resources"
          output = root / "dist" / "android-runtime"
          staging = output / f"Shellsmith-{version}-android-runtime"
          output.mkdir(parents=True, exist_ok=True)
          staging.mkdir(parents=True, exist_ok=True)

          required = [
              source / "resources.zip",
              source / "resources-api19.zip",
              source / "mocika-play-delivery-api.jar",
              root / "tools" / "xop-pvm2-packer.jar",
              root / "tools" / "licenses" / "XopProtector-LICENSE.txt",
              root / "tools" / "licenses" / "XopProtector-NOTICE.txt",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("缺少 Android 运行时资源: " + ", ".join(missing))

          for path in required:
              shutil.copy2(path, staging / path.name)
          (staging / "README.txt").write_text(
              "Shellsmith Android runtime resources\n"
              "用于桌面 CLI/GUI 生成 Android APK/AAB；这不是可直接安装在 Android 手机上的 GUI。\n",
              encoding="utf-8",
          )
          archive = output / f"Shellsmith_{version}_android-runtime.zip"
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as handle:
              for path in sorted(staging.rglob("*")):
                  if path.is_file():
                      handle.write(path, path.relative_to(output))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (output / "checksums-sha256.txt").write_text(
              f"{digest}  {archive.name}\n", encoding="utf-8"
          )
          shutil.rmtree(staging)
          print(archive)
          PY

      - name: 上传 Linux 产物到草稿 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/normalize_release_checksums.py \
            dist/linux/checksums-sha256.txt dist/android-runtime/checksums-sha256.txt
          mv dist/linux/checksums-sha256.txt dist/linux/linux-tauri-checksums-sha256.txt
          mv dist/android-runtime/checksums-sha256.txt dist/android-runtime/android-runtime-checksums-sha256.txt
          files=(dist/linux/linux-tauri-checksums-sha256.txt dist/android-runtime/android-runtime-checksums-sha256.txt)
          while IFS= read -r -d '' file; do files+=("$file"); done < <(
            find dist/linux dist/android-runtime -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name '*.sig' \) -print0
          )
          test "${#files[@]}" -gt 2
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  macos-tauri:
    name: macOS Tauri 发布包
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: prepare
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}



      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shield-gui/package-lock.json

      - name: 配置 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "ndk;${ANDROID_NDK_API19_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 下载 macOS AAB bundletool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fsSL --retry 5 \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            -o tools/bundletool.jar
          echo "BUNDLETOOL_JAR=$GITHUB_WORKSPACE/tools/bundletool.jar" >> "$GITHUB_ENV"

      - name: 配置 Rust target 与构建工具
        run: |
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          cargo install cargo-ndk --locked
          cargo install tauri-cli --version 2.11.5 --locked
          rustup toolchain install 1.77.2 --profile minimal --target armv7-linux-androideabi

      - name: 同步发布版本号
        shell: bash
        run: bash scripts/bump-version.sh "$VERSION"

      - name: 安装 GUI 前端依赖
        working-directory: apps/shield-gui
        run: npm ci

      - name: 构建 macOS Tauri Universal 发布包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: SKIP_CLI_RELEASE=1 VERSION="$VERSION" ./scripts/release-macos.sh "$VERSION" universal

      - name: 上传 macOS 产物到草稿 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/normalize_release_checksums.py dist/macos/checksums-sha256.txt
          mv dist/macos/checksums-sha256.txt dist/macos/macos-tauri-checksums-sha256.txt
          files=(dist/macos/macos-tauri-checksums-sha256.txt)
          while IFS= read -r -d '' file; do files+=("$file"); done < <(
            find dist/macos -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) -print0
          )
          test "${#files[@]}" -gt 1
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    name: Windows 发布包
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: prepare
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}



      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shield-gui/package-lock.json

      - name: 安装 NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: 配置 Android SDK / NDK
        shell: pwsh
        run: |
          1..20 | ForEach-Object { "y" } | sdkmanager --licenses | Out-Null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$env:ANDROID_NDK_VERSION" "ndk;$env:ANDROID_NDK_API19_VERSION"
          "ANDROID_NDK_ROOT=$env:ANDROID_HOME\ndk\$env:ANDROID_NDK_VERSION" >> $env:GITHUB_ENV

      - name: 准备 Windows AAB 工具并写入 GUI 资源
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "tools" | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" `
            -OutFile "tools\bundletool.jar"
          $aapt2 = Get-ChildItem "$env:ANDROID_HOME\build-tools\*\aapt2.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $aapt2) { throw "未找到 aapt2.exe" }
          Copy-Item $aapt2.FullName "tools\aapt2.exe" -Force
          $configPath = "apps\shield-gui\src-tauri\tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.resources | Add-Member -NotePropertyName "../../../tools/bundletool.jar" -NotePropertyValue "tools/bundletool.jar"
          $config.bundle.resources | Add-Member -NotePropertyName "../../../tools/aapt2.exe" -NotePropertyValue "tools/aapt2.exe"
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding UTF8

      - name: 配置 Android 4.4 兼容 Rust 工具链
        shell: pwsh
        run: rustup toolchain install 1.77.2 --profile minimal --target armv7-linux-androideabi

      - name: 同步发布版本号
        shell: bash
        run: bash scripts/bump-version.sh "$VERSION"

      - name: 安装 GUI 前端依赖
        working-directory: apps/shield-gui
        run: npm ci

      - name: 构建 Windows 发布包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: pwsh
        run: |
          $env:SKIP_CLI_RELEASE = "1"
          .\scripts\release-windows.ps1 -Version $env:VERSION

      - name: 上传 Windows 产物到草稿 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python scripts/normalize_release_checksums.py dist/windows/checksums-sha256.txt
          if ($LASTEXITCODE -ne 0) { throw "校验和规范化失败" }
          Move-Item dist/windows/checksums-sha256.txt dist/windows/windows-checksums-sha256.txt
          $files = @("dist/windows/windows-checksums-sha256.txt")
          $files += @(Get-ChildItem dist/windows -Recurse -File -Include *.exe,*.sig | ForEach-Object FullName)
          if ($files.Count -le 1) { throw "缺少 Windows 安装包" }
          gh release upload $env:TAG @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 Windows 安装包失败" }

  publish:
    name: 发布到 GitHub Releases
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - linux-tauri
      - macos-tauri
      - windows
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: 解析发布类型
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

      - name: 生成 Release Notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "## 本次自动构建 / This automated build"
            echo
            git show -s --format='- 提交 / Commit: `%h` — %s' HEAD
            echo
            echo "### 文件变更统计 / File change summary"
            git diff --stat HEAD^ HEAD || true
          } > automatic-changes.md

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            template=".github/release-notes/prerelease.md"
            release_kind="预发布版本"
          else
            template=".github/release-notes/stable.md"
            release_kind="正式版本"
          fi

          sed \
            -e "s/{{version}}/$VERSION/g" \
            -e "s/{{tag}}/$TAG/g" \
            -e "s/{{release_kind}}/$release_kind/g" \
            "$template" > release-notes-prefix.md

          series_version="${VERSION%%-*}"
          highlights=".github/release-notes/versions/${series_version}.md"
          if [[ -f "$highlights" ]]; then
            printf '\n' >> release-notes-prefix.md
            cat "$highlights" >> release-notes-prefix.md
          fi

          previous_stable_tag="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -rs --arg tag "$TAG" \
                '[.[][] | select(.draft == false and .prerelease == false and .tag_name != $tag)][0].tag_name // empty'
          )"

          generate_args=(
            -f tag_name="$TAG"
            -f configuration_file_path=".github/release.yml"
          )
          if [[ -n "$previous_stable_tag" ]]; then
            generate_args+=(-f previous_tag_name="$previous_stable_tag")
            printf 'Release Notes 比较基线：%s\n' "$previous_stable_tag"
          else
            printf '未找到上一正式版本，使用 GitHub 默认比较基线\n'
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${generate_args[@]}" \
            > generated-release-notes.json

          jq -r '.body' generated-release-notes.json > generated-release-notes-body.md
          awk '
            !removed && /^## What.s Changed$/ { removed = 1; next }
            { print }
          ' generated-release-notes-body.md > generated-release-notes-normalized.md

          cat release-notes-prefix.md > release-notes.md
          printf '\n\n' >> release-notes.md
          cat automatic-changes.md >> release-notes.md
          printf '\n\n---\n\n' >> release-notes.md
          cat generated-release-notes-normalized.md >> release-notes.md

      - name: 验证产物并公开 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets > release-assets.json
          python3 -c 'import json; print("\n".join(a["name"] for a in json.load(open("release-assets.json"))["assets"]))' > release-assets.txt
          for expected in macos-tauri linux-tauri windows android-runtime; do
            grep -Fxq "${expected}-checksums-sha256.txt" release-assets.txt
          done
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir update-signatures
          python3 scripts/generate_update_manifest.py "$VERSION" release-assets.json update-signatures release-notes.md latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease
          else
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --draft=false --latest
          fi
