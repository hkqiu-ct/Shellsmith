name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_NDK_API19_VERSION: 25.2.9519653

jobs:
  changes:
    name: 变更范围检查
    runs-on: ubuntu-24.04
    outputs:
      run_checks: ${{ steps.scope.outputs.run_checks }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 判断是否需要快速检查
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" ]]; then
            base_sha="$BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          run_checks=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              docs/*|*.md|LICENSE|LICENSE.*)
                ;;
              *)
                run_checks=true
                ;;
            esac
          done < <(git diff --name-only "$base_sha" HEAD)

          echo "run_checks=$run_checks" >> "$GITHUB_OUTPUT"

  quick-checks:
    name: 基础快速检查
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查 Rust 格式
        run: cargo fmt --all --check

      - name: 运行发布与统计脚本测试
        run: python3 -m unittest discover -s scripts/tests -v

  fusion-contract:
    name: 融合协议和单壳契约
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查 Rust 格式
        run: cargo fmt --all --check

      - name: 从源码重建并验证 PVM2 方法保护
        run: make test-pvm2

      - name: 检查 PVM2 运行时并发与明文生命周期
        run: make test-pvm2-runtime

      - name: 运行融合核心测试
        run: make test-fusion

      - name: 检查发布验收文档和 Issue 台账
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/process/issue-ledger.md
          test -s docs/process/compatibility-matrix.md
          test -s docs/process/release-acceptance-fusion.md
          grep -q 'DEXB v6' docs/process/release-acceptance-fusion.md
          grep -q 'preflight-only' docs/usage.md

  ios-core:
    name: iOS 核心与 Xcode ${{ matrix.xcode }} 归档
    runs-on: macos-15
    strategy:
      matrix:
        xcode: ["16.4", "26.0.1"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查 Xcode 与 Swift
        run: |
          xcodebuild -version
          swift --version

      - name: 检查 iOS Rust 核心
        run: |
          cargo clippy -p shield-ios --all-targets -- -D warnings
          cargo test -p shield-ios

      - name: 验证官方 SDK 导入与断网解析
        run: |
          curl --disable --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 180 --retry 2 \
            https://codeload.github.com/talsec/Free-RASP-iOS/zip/958d7b1933e28fc33f3b7a2725fc174d98c0939f \
            --output "$RUNNER_TEMP/freerasp.zip"
          SHELLSMITH_TEST_FREERASP_ZIP="$RUNNER_TEMP/freerasp.zip" \
            cargo test -p shield-ios official_sdk_import_reuse_and_offline_resolve -- --ignored --nocapture

      - name: 归档带扩展的 Objective-C 工程与工作区
        env:
          SHELLSMITH_TEST_XCODE_ARCHIVE: "1"
        run: SHELLSMITH_TEST_FREERASP_ZIP="$RUNNER_TEMP/freerasp.zip" cargo test -p shield-ios patches_local_package_into_application_target -- --nocapture

  full-quality:
    name: 完整代码质量检查
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shield-gui/package-lock.json

      - name: 检查 Rust Clippy
        run: cargo clippy -p shield-core -p shield-ios -p shield-cli --all-targets -- -D warnings

      - name: 运行 Rust 单元测试
        run: |
          cargo test -p shield-core
          cargo test -p shield-ios
          cargo test -p shield-cli
          cargo test --manifest-path shield-stub/src/main/rust/Cargo.toml

      - name: 安装 GUI 前端依赖
        working-directory: apps/shield-gui
        run: npm ci

      - name: 检查 GUI 前端
        working-directory: apps/shield-gui
        run: |
          node --test tests/*.test.mjs
          npm run lint
          npm run typecheck
          npm run build

  linux-gui-bundle:
    name: Linux Tauri 打包冒烟检查
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7



      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shield-gui/package-lock.json

      - name: 安装 Linux Tauri 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf \
            libfuse2

      - name: 配置 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "ndk;${ANDROID_NDK_API19_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 配置 Rust target 与构建工具
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          cargo install cargo-ndk --locked
          cargo install tauri-cli --locked
          rustup toolchain install 1.77.2 --profile minimal --target armv7-linux-androideabi

      - name: 安装 GUI 前端依赖
        working-directory: apps/shield-gui
        run: npm ci

      - name: 构建 shield-stub
        run: make build-stub

      - name: 检查 Stub DEX 指标
        run: make audit-stub-dex

      - name: 检查 Linux Tauri bundle
        working-directory: apps/shield-gui
        run: cargo tauri build --bundles appimage,deb --debug --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 验证 GUI 更新安全与业务回归
        run: cargo test -p mocika-shield

  stub:
    name: Android 壳构建
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7



      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 配置 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "ndk;${ANDROID_NDK_API19_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 配置 Rust Android target
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          rustup toolchain install 1.77.2 --profile minimal --target armv7-linux-androideabi

      - name: 构建 shield-stub
        run: make build-stub

      - name: 上传 resources.zip
        uses: actions/upload-artifact@v7
        with:
          name: resources-zip
          path: shield-stub/build/outputs/resources/resources.zip
          if-no-files-found: error

      - name: 运行端到端加固回归测试
        run: bash tests/scripts/run-protect-e2e.sh

  windows-api19-resources:
    name: Windows Android 4.4 资源构建
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025

    steps:
      - name: 检出代码
        uses: actions/checkout@v7



      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 配置 Android SDK / NDK
        shell: pwsh
        run: |
          1..20 | ForEach-Object { "y" } | sdkmanager --licenses | Out-Null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$env:ANDROID_NDK_VERSION" "ndk;$env:ANDROID_NDK_API19_VERSION"
          "ANDROID_NDK_ROOT=$env:ANDROID_HOME\ndk\$env:ANDROID_NDK_VERSION" >> $env:GITHUB_ENV

      - name: 配置 Rust Android 工具链
        shell: pwsh
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup toolchain install 1.77.2 --profile minimal --target armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: 构建标准与 Android 4.4 兼容资源
        shell: pwsh
        run: |
          .\scripts\build-stub.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SKIP_STANDARD_STUB_BUILD = "1"
          & bash "scripts/build-android-api19-resources.sh"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "shield-stub\build\outputs\resources\resources-api19.zip")) {
            throw "resources-api19.zip 未生成"
          }

  release-readiness:
    name: 发布前检查
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7



      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 配置 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "ndk;${ANDROID_NDK_API19_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 配置 Rust Android target
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          rustup toolchain install 1.77.2 --profile minimal --target armv7-linux-androideabi

      - name: 构建 shield-stub
        run: make build-stub

      - name: 运行发布前检查
        run: bash scripts/check-release-ready.sh
