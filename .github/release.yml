changelog:
  exclude:
    labels:
      - skip-release-notes
  categories:
    - title: 安全与兼容
      labels:
        - security
        - compat
    - title: Android
      labels:
        - android
    - title: iOS
      labels:
        - ios
    - title: BYOS 与服务端
      labels:
        - byos
    - title: 新功能
      labels:
        - feat
        - enhancement
        - feature
    - title: 修复
      labels:
        - fix
        - bug
        - bugfix
    - title: 文档与工程
      labels:
        - docs
        - ci
        - build
        - chore
        - refactor
    - title: 其他变更
      labels:
        - "*"
