[package]
name = "shield-ios"
version = "1.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shellsmith iOS 工程检查、保护接入、归档与签名验证核心"
repository = "https://github.com/kairowan/Shellsmith"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
toml = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
