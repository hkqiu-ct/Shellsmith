[package]
name = "mocika-shield"
version = "1.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Shellsmith Android APK 加固桌面工具"
default-run = "mocika-shield"
build = "build.rs"

[build-dependencies]
serde_json = "1.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "=2.12.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
shield-core = { path = "../../../crates/shield-core" }
shield-cli = { path = "../../shield-cli" }
shield-ios = { path = "../../../crates/shield-ios" }
zip = { version = "2", default-features = false, features = ["deflate"] }
which = "8"
dunce = "1"
url = "2"
toml = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.11.5", features = ["test"] }

# 打开外部链接时不经过 cmd.exe，直接调用 shell API（见 file_ops.rs）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
