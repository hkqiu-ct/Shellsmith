[workspace]
members = [
    "crates/shield-core",
    "crates/shield-ios",
    "apps/shield-cli",
    "apps/shield-gui/src-tauri",
    "shield-stub/src/main/rust",
]
resolver = "2"

[workspace.dependencies]
zstd = { version = "0.13", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "thread_rng", "os_rng"] }
directories = "6"

[profile.release]
opt-level = "z"      # 优化体积
lto = true           # 链接时优化
strip = "symbols"    # 移除符号表（比 strip = true 更明确、更激进）
panic = "abort"      # 减少 unwind 代码体积
codegen-units = 1    # 更激进的跨单元优化

# 手机上每次启动都要认证载荷并初始化解释器，运行时优先优化执行速度。
# 桌面程序仍沿用体积优先设置；不改变算法、认证或解释器准入规则。
[profile.release.package.mocikashield]
opt-level = 2

# 载荷每次启动都需要完整认证；共享密码库也优先优化吞吐，不改变密码协议。
[profile.release.package.chacha20poly1305]
opt-level = 3

[profile.release.package.chacha20]
opt-level = 3

[profile.release.package.poly1305]
opt-level = 3
